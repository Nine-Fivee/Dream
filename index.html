<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital@0;1&family=Press+Start+2P&family=Share+Tech+Mono&family=EB+Garamond:ital@1&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;cursor:none;user-select:none}
  #C{display:block;width:100vw;height:100vh;image-rendering:pixelated}
  #cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:#fff2;pointer-events:none;z-index:10;mix-blend-mode:difference}
  #dtxt{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#fff;z-index:30;pointer-events:none;text-align:center;line-height:2;text-shadow:0 0 30px currentColor;opacity:0;transition:opacity 2s;max-width:70vw;white-space:pre-line}
  #hint{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:11px;color:#fff4;z-index:20;pointer-events:none;text-align:center}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at center,transparent 40%,#000a 80%,#000 100%)}
  #scn{position:fixed;inset:0;pointer-events:none;z-index:16;background:repeating-linear-gradient(0deg,#0001 0px,transparent 1px,transparent 3px);opacity:.15}
  #overlay{position:fixed;inset:0;background:#000;z-index:50;pointer-events:none;opacity:0;transition:opacity 3s}
  #sleepTxt{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Crimson Text',serif;font-style:italic;font-size:22px;color:#fff;z-index:55;pointer-events:none;opacity:0;transition:opacity 2s;text-align:center;line-height:2.5}
  #titleScreen{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  #titleScreen h1{font-family:'Crimson Text',serif;font-style:italic;font-size:42px;color:#fff;letter-spacing:16px;margin-bottom:40px;font-weight:400;opacity:.7}
  #titleScreen .sub{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff2;animation:bl 3s ease-in-out infinite;letter-spacing:4px}
  @keyframes bl{0%,100%{opacity:.4}50%{opacity:.1}}
  #scare{position:fixed;inset:0;z-index:200;display:none;background:#000}
  #scare canvas{width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<div id="titleScreen"><h1>dream</h1><div class="sub">[ click ]</div></div>
<canvas id="C"></canvas>
<div id="cross"></div><div id="vig"></div><div id="scn"></div>
<div id="dtxt"></div><div id="hint"></div>
<div id="overlay"></div><div id="sleepTxt"></div>
<div id="scare"><canvas id="scareCanvas"></canvas></div>

<script>
const RW=520,RH=320,TX=64,FOV=Math.PI/3,SPD=2.5,RSPD=.002;
const cv=document.getElementById('C'),ct=cv.getContext('2d');
cv.width=RW;cv.height=RH;

let P={x:4,y:4,a:0,bob:0,moving:false};
let keys={},mXa=0,started=false,playerFrozen=false,endTriggered=false;
let map=[],mW=0,mH=0,sprites=[],doorZones=[];
let dTime=0,transA=0,transing=false,transTgt='';
let phase='house',layerDepth=0,dread=0,dreamCount=0,horrorDepth=0;
let hasWokenUp=false;

function setTextStyle(depth){const el=document.getElementById('dtxt');if(depth<=0){el.style.fontFamily='"Crimson Text",serif';el.style.fontStyle='italic';el.style.fontSize='18px';}else if(depth<=1){el.style.fontFamily='"EB Garamond",serif';el.style.fontStyle='italic';el.style.fontSize='16px';}else if(depth<=3){el.style.fontFamily='"Share Tech Mono",monospace';el.style.fontStyle='normal';el.style.fontSize='13px';}else{el.style.fontFamily='"Press Start 2P",monospace';el.style.fontStyle='normal';el.style.fontSize='10px';}}

// ═══════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════
let AC=null,masterG,droneO=[];
function initAudio(){AC=new(window.AudioContext||window.webkitAudioContext)();masterG=AC.createGain();masterG.gain.value=1;masterG.connect(AC.destination);}
function startDrone(){if(droneO.length)return;[42,42.7,63,84.2].forEach((f,i)=>{const o=AC.createOscillator();o.type=['sine','sine','triangle','sine'][i];o.frequency.value=f;const g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(masterG);o.start();droneO.push({o,g});});const lfo=AC.createOscillator();lfo.frequency.value=.12;const lg=AC.createGain();lg.gain.value=6;lfo.connect(lg);lg.connect(droneO[0].o.frequency);lfo.start();droneO._lfo=lfo;droneO._lg=lg;}
function setDrn(p){if(!AC||!droneO.length)return;const t=AC.currentTime;droneO.forEach((d,i)=>{d.o.frequency.setTargetAtTime(p.b*[1,1.02,1.5,2.01][i],t,3);d.g.gain.setTargetAtTime(Math.min(.09,p.v/(i+1)),t,2);});droneO._lfo.frequency.setTargetAtTime(p.l,t,1.5);droneO._lg.gain.setTargetAtTime(p.d,t,1.5);}
function fadeDrone(){if(!AC||!droneO.length)return;const t=AC.currentTime;droneO.forEach(d=>d.g.gain.setTargetAtTime(0,t,2));}
function startHouseAmb(){if(!AC)return;const tick=()=>{if(phase!=='house'&&phase!=='wakeup')return;const t=AC.currentTime;const o=AC.createOscillator();o.type='sine';o.frequency.value=800;const g=AC.createGain();g.gain.setValueAtTime(.008,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);o.connect(g);g.connect(masterG);o.start(t);o.stop(t+.05);setTimeout(tick,1000);};tick();}

let lastStp=0;
function playStp(){if(!AC||dTime-lastStp<.3)return;lastStp=dTime;const t=AC.currentTime;const isH=phase==='house'||phase==='wakeup'||phase==='endHall';
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(isH?120:65+Math.random()*20,t);o.frequency.exponentialRampToValueAtTime(isH?60:22,t+.06);
  const g=AC.createGain();g.gain.setValueAtTime(isH?.035:.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
  const bs=AC.sampleRate*.03,buf=AC.createBuffer(1,bs,AC.sampleRate),bd=buf.getChannelData(0);for(let i=0;i<bs;i++)bd[i]=(Math.random()*2-1)*Math.exp(-i/bs*5);
  const ns=AC.createBufferSource();ns.buffer=buf;const ng=AC.createGain();ng.gain.setValueAtTime(.03,t);ng.gain.exponentialRampToValueAtTime(.001,t+.05);
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=isH?2000:phase==='horror'?400:1000;
  o.connect(g);g.connect(fl);ns.connect(ng);ng.connect(fl);fl.connect(masterG);o.start(t);o.stop(t+.12);ns.start(t);ns.stop(t+.07);}

function playE(type){if(!AC)return;const t=AC.currentTime;
  const mk=(dur,fn)=>{const bs=AC.sampleRate*dur,buf=AC.createBuffer(1,bs,AC.sampleRate),bd=buf.getChannelData(0);for(let i=0;i<bs;i++)bd[i]=fn(i,bs,AC.sampleRate);const s=AC.createBufferSource();s.buffer=buf;return s;};
  if(type==='whisper'){const s=mk(1.8,(i,n,sr)=>Math.sin(i/n*Math.PI)*(Math.random()*2-1)*.5*(.5+.5*Math.sin(i/sr*2*Math.PI*(70+Math.random()*50))));const g=AC.createGain();g.gain.value=.03;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=4;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='cry'){const s=mk(3,(i,n,sr)=>{const e=Math.sin(i/n*Math.PI),v=Math.sin(i/sr*2*Math.PI*5)*.3;return(Math.random()*2-1)*e*.3*(.5+.5*Math.sin(i/sr*2*Math.PI*(320+v*80)));});const g=AC.createGain();g.gain.value=.02+dread*.02;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=6;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='help'){const s=mk(.8,(i,n,sr)=>{const p2=i/n;let e=0;if(p2<.15)e=Math.sin(p2/.15*Math.PI)*.8;else if(p2<.35)e=Math.sin((p2-.15)/.2*Math.PI);else if(p2<.6)e=Math.sin((p2-.35)/.25*Math.PI)*.7;else if(p2<.8)e=Math.sin((p2-.6)/.2*Math.PI)*.6;return(Math.random()*2-1)*e*(.3+.7*Math.sin(i/sr*2*Math.PI*(p2<.15?2000:p2<.35?500:p2<.6?800:300)));});const g=AC.createGain();g.gain.value=.025;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=3;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='demon'){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(35+Math.random()*20,t);o.frequency.linearRampToValueAtTime(25,t+2.5);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04+dread*.03,t+.5);g.gain.linearRampToValueAtTime(0,t+3);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=120;o.connect(f);f.connect(g);g.connect(masterG);o.start(t);o.stop(t+3.5);}
  else if(type==='breathing'){const s=mk(3,(i,n)=>{const c=(i/n)*2%1,e=c<.4?Math.sin(c/.4*Math.PI):.6*Math.sin((c-.4)/.6*Math.PI);return(Math.random()*2-1)*e*.4;});const g=AC.createGain();g.gain.value=.03+dread*.02;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=400;f.Q.value=2;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='tone'){const freq=150+Math.random()*500;[freq,freq*1.002].forEach(fr=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=fr;const g=AC.createGain();g.gain.setValueAtTime(.02,t);g.gain.exponentialRampToValueAtTime(.001,t+3);o.connect(g);g.connect(masterG);o.start(t);o.stop(t+3.5);});}
  else if(type==='creak'){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(200+Math.random()*100,t);o.frequency.linearRampToValueAtTime(140,t+.9);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.015,t+.1);g.gain.linearRampToValueAtTime(0,t+1);const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=300;f.Q.value=8;o.connect(f);f.connect(g);g.connect(masterG);o.start(t);o.stop(t+1.1);}
  else if(type==='rumble'){const s=mk(2,(i,n)=>(Math.random()*2-1)*Math.sin(i/n*Math.PI));const g=AC.createGain();g.gain.value=.04;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=60;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='heartbeat'){for(let b=0;b<4;b++){const bt=t+b*.7;const o1=AC.createOscillator();o1.type='sine';o1.frequency.setValueAtTime(60,bt);o1.frequency.exponentialRampToValueAtTime(30,bt+.1);const g1=AC.createGain();g1.gain.setValueAtTime(.06,bt);g1.gain.exponentialRampToValueAtTime(.001,bt+.15);o1.connect(g1);g1.connect(masterG);o1.start(bt);o1.stop(bt+.2);}}
  else if(type==='wind'){const s=mk(3,(i,n)=>{const e=Math.sin(i/n*Math.PI);return(Math.random()*2-1)*e*.15;});const g=AC.createGain();g.gain.value=.02;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;s.connect(f);f.connect(g);g.connect(masterG);s.start(t);}
  else if(type==='birds'){for(let b=0;b<3;b++){const bt=t+b*.5+Math.random()*.3;const o=AC.createOscillator();o.type='sine';const f0=1800+Math.random()*1200;o.frequency.setValueAtTime(f0,bt);o.frequency.linearRampToValueAtTime(f0+200+Math.random()*400,bt+.08);o.frequency.linearRampToValueAtTime(f0-100,bt+.15);const g=AC.createGain();g.gain.setValueAtTime(0,bt);g.gain.linearRampToValueAtTime(.008,bt+.02);g.gain.linearRampToValueAtTime(0,bt+.2);o.connect(g);g.connect(masterG);o.start(bt);o.stop(bt+.25);}}
}

// ─── TV STATIC (ambient — gets louder as you approach) ───
let tvStatic=null;
function startTVStatic(){
  if(!AC||tvStatic)return;
  const bs=AC.sampleRate*2;const buf=AC.createBuffer(1,bs,AC.sampleRate);const bd=buf.getChannelData(0);
  for(let i=0;i<bs;i++)bd[i]=(Math.random()*2-1)*.5;
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;
  const g=AC.createGain();g.gain.value=0;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=3200;f.Q.value=.6;
  s.connect(f);f.connect(g);g.connect(masterG);s.start();
  tvStatic={src:s,gain:g};
}
function updateTVStatic(){
  if(!tvStatic||phase!=='endHall')return;
  const dist=Math.hypot(P.x-mW/2,P.y-2);
  const vol=Math.max(.03,Math.min(.13,.18-dist*.013));
  tvStatic.gain.gain.setTargetAtTime(vol,AC.currentTime,.15);
}
function stopTVStatic(){if(tvStatic){tvStatic.gain.gain.setTargetAtTime(0,AC.currentTime,.3);setTimeout(()=>{try{tvStatic.src.stop();}catch(e){}tvStatic=null;},1000);}}

// ═══════════════════════════════════════════
// WATCHER
// ═══════════════════════════════════════════
let W8={x:0,y:0,active:false,opacity:0,timer:0,next:15,img:null};
function genW8(){const c=document.createElement('canvas');c.width=48;c.height=96;const x=c.getContext('2d');
  x.fillStyle='#020202';
  x.fillRect(6,2,36,5);x.fillRect(14,0,20,4);
  x.beginPath();x.ellipse(24,14,6,8,0,0,Math.PI*2);x.fill();
  x.fillRect(22,22,4,4);
  x.beginPath();x.moveTo(16,26);x.lineTo(32,26);x.lineTo(30,58);x.lineTo(18,58);x.closePath();x.fill();
  x.fillRect(8,28,8,36);x.fillRect(32,28,8,36);
  x.fillRect(7,62,10,4);x.fillRect(31,62,10,4);
  x.fillRect(19,58,5,34);x.fillRect(28,58,5,34);
  x.fillStyle='rgba(255,255,255,0.03)';x.fillRect(20,12,3,1);x.fillRect(26,12,3,1);
  return x.getImageData(0,0,48,96);}
function spawnW8(front){if(W8.active&&!front)return;if(!W8.img)W8.img=genW8();
  const ang=front?P.a:P.a+Math.PI+((Math.random()-.5)*1.5),dist=front?2:4+Math.random()*5;
  W8.x=Math.max(1.5,Math.min(mW-1.5,P.x+Math.cos(ang)*dist));
  W8.y=Math.max(1.5,Math.min(mH-1.5,P.y+Math.sin(ang)*dist));
  W8.active=true;W8.opacity=front?1:0;
  if(!front){playE('breathing');setTimeout(()=>playE('whisper'),800+Math.random()*1500);}}
function updateW8(dt){if(endTriggered||phase==='house'||phase==='sleep'||phase==='endHall'||phase==='wakeup')return;
  W8.timer+=dt;const rate=phase==='horror'?(horrorDepth>=5?3+Math.random()*4:6+Math.random()*8):phase==='fog'?8+Math.random()*10:15+Math.random()*25;
  if(!W8.active&&W8.timer>W8.next&&dreamCount>1){W8.timer=0;W8.next=rate;spawnW8(false);}
  if(!W8.active)return;const dist=Math.hypot(W8.x-P.x,W8.y-P.y);
  let ang=Math.atan2(W8.y-P.y,W8.x-P.x)-P.a;while(ang>Math.PI)ang-=2*Math.PI;while(ang<-Math.PI)ang+=2*Math.PI;
  const absA=Math.abs(ang);if(playerFrozen)return;
  if(absA<FOV*.22){W8.opacity-=dt*3.5;if(W8.opacity<=0){W8.active=false;W8.opacity=0;}}
  else if(absA<=FOV*.55){W8.opacity=Math.min(1,W8.opacity+dt*1.5);if(Math.random()<dt*.3)playE('whisper');}
  else W8.opacity=Math.max(0,W8.opacity-dt*.4);
  if(dist>16||dist<.6){W8.active=false;W8.opacity=0;}
  if(dist<5&&Math.random()<dt*.12)playE('breathing');}

// ─── ZALGO ───
const zu='\u030d\u030e\u0304\u0305\u033f\u0311\u0306\u0310\u0352\u0357\u0307\u0308\u030a\u0342\u0343\u034a\u034b\u0303\u0302\u030c\u0300\u0301'.split('');
const zm='\u0315\u031b\u0340\u0341\u0321\u0322\u0327\u0328\u0334\u0335\u0336'.split('');
const zd='\u0316\u0317\u0318\u0319\u031c\u031d\u031e\u031f\u0320\u0324\u0325\u0329\u032a\u032b\u032c\u032d\u032e\u032f\u0330\u0331\u0332'.split('');
function corrupt(s,n){let o='';for(let i=0;i<s.length;i++){o+=s[i];const c=Math.floor(n*4)+1;for(let j=0;j<c;j++){if(Math.random()<.7)o+=zu[Math.random()*zu.length|0];if(Math.random()<.4)o+=zm[Math.random()*zm.length|0];if(Math.random()<.6)o+=zd[Math.random()*zd.length|0];}}return o;}
const HDOORS=['HELP ME','DO NOT ENTER','COME CLOSER','IT HURTS','DEEPER','BEHIND YOU','FORGET','REMEMBER','THEY SEE YOU','RUN','SILENCE','TEETH','CRAWLING','I SEE YOU','TOO LATE','HOLLOW','INSIDE','FALLING','BORN WRONG','THE MOUTH','GONE','PAPER THIN'];
const HMSG=["you shouldn't be here","it's too late to go back","can you hear them","you chose this","it remembers your name","you are not dreaming anymore","it has your face","the crying stopped","that is not an echo","deeper still","it's inside the walls","the walls know","the silence has teeth","you hear yourself screaming","don't look up"];

// ═══════════════════════════════════════════
// TEXTURES
// ═══════════════════════════════════════════
function mkTex(fn){const c=document.createElement('canvas');c.width=c.height=TX;const x=c.getContext('2d');fn(x);const id=x.getImageData(0,0,TX,TX);for(let i=0;i<id.data.length;i+=4){const n=(Math.random()-.5)*5;id.data[i]+=n;id.data[i+1]+=n;id.data[i+2]+=n;}return id;}
const TEX_CACHE={};
function tex(name){if(TEX_CACHE[name])return TEX_CACHE[name];
  const t=mkTex(x=>{
    if(name==='houseWall'){x.fillStyle='hsl(35,15%,65%)';x.fillRect(0,0,TX,TX);for(let i=0;i<80;i++){x.fillStyle=`hsla(35,12%,${63+Math.random()*4}%,.3)`;x.fillRect(Math.random()*TX,Math.random()*TX,1+Math.random()*2,1+Math.random()*2);}}
    else if(name==='houseInt'){x.fillStyle='hsl(35,12%,60%)';x.fillRect(0,0,TX,TX);x.strokeStyle='hsla(35,15%,55%,.12)';x.lineWidth=.5;for(let i=0;i<TX;i+=8){x.beginPath();x.moveTo(i,0);x.lineTo(i,TX);x.stroke();}}
    else if(name==='houseTile'){x.fillStyle='hsl(200,8%,72%)';x.fillRect(0,0,TX,TX);x.strokeStyle='hsl(200,5%,62%)';x.lineWidth=1;for(let i=0;i<=TX;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i,TX);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(TX,i);x.stroke();}}
    else if(name==='bedWall'){x.fillStyle='hsl(30,20%,45%)';x.fillRect(0,0,TX,TX);x.strokeStyle='hsla(30,18%,38%,.2)';x.lineWidth=.5;for(let i=0;i<TX;i+=8){x.beginPath();x.moveTo(i,0);x.lineTo(i,TX);x.stroke();}for(let i=0;i<30;i++){x.fillStyle=`hsla(30,22%,${42+Math.random()*4}%,.3)`;x.fillRect(Math.random()*TX,Math.random()*TX,1+Math.random()*2,1+Math.random()*2);}}
    else if(name==='wood'){x.fillStyle='hsl(25,30%,22%)';x.fillRect(0,0,TX,TX);for(let i=0;i<TX;i+=4){x.strokeStyle=`hsla(25,35%,${19+Math.random()*6}%,.4)`;x.lineWidth=.5;x.beginPath();x.moveTo(0,i+Math.random()*2);x.bezierCurveTo(TX*.3,i+Math.random()*3,TX*.7,i-Math.random()*3,TX,i+Math.random()*2);x.stroke();}}
    else if(name==='grass'){x.fillStyle='hsl(110,40%,25%)';x.fillRect(0,0,TX,TX);for(let i=0;i<120;i++){x.strokeStyle=`hsla(${100+Math.random()*30},${35+Math.random()*15}%,${20+Math.random()*15}%,.6)`;x.lineWidth=.5;const gx=Math.random()*TX;x.beginPath();x.moveTo(gx,TX-Math.random()*8);x.lineTo(gx+(Math.random()-.5)*3,TX-8-Math.random()*10);x.stroke();}}
    else if(name==='water'){x.fillStyle='hsl(210,35%,18%)';x.fillRect(0,0,TX,TX);for(let i=0;i<TX;i+=3){x.strokeStyle=`hsla(210,45%,${22+Math.random()*10}%,.25)`;x.lineWidth=1;x.beginPath();x.moveTo(0,i);for(let j=0;j<TX;j+=6)x.quadraticCurveTo(j+3,i+(Math.random()-.5)*2,j+6,i);x.stroke();}}
    else if(name==='dirt'){x.fillStyle='hsl(25,20%,18%)';x.fillRect(0,0,TX,TX);for(let i=0;i<150;i++){x.fillStyle=`hsla(${20+Math.random()*15},${15+Math.random()*10}%,${15+Math.random()*10}%,.5)`;x.fillRect(Math.random()*TX,Math.random()*TX,1+Math.random()*2,1+Math.random()*2);}}
    else if(name==='leaves'){x.fillStyle='hsl(25,20%,18%)';x.fillRect(0,0,TX,TX);for(let i=0;i<40;i++){x.fillStyle=`hsla(${20+Math.random()*30},${30+Math.random()*20}%,${25+Math.random()*20}%,.6)`;const sz=2+Math.random()*4;x.beginPath();x.ellipse(Math.random()*TX,Math.random()*TX,sz,sz*.5,Math.random()*Math.PI,0,Math.PI*2);x.fill();}}
    else if(name==='tree'){x.fillStyle='hsl(25,25%,15%)';x.fillRect(0,0,TX,TX);for(let i=0;i<TX;i+=3){x.strokeStyle=`hsla(25,20%,${12+Math.random()*8}%,.5)`;x.lineWidth=1;x.beginPath();x.moveTo(Math.random()*TX,0);x.lineTo(Math.random()*TX,TX);x.stroke();}}
    else if(name==='treeAutumn'){x.fillStyle='hsl(20,18%,12%)';x.fillRect(0,0,TX,TX);for(let i=0;i<TX;i+=4){x.strokeStyle=`hsla(20,15%,${10+Math.random()*6}%,.5)`;x.lineWidth=1;x.beginPath();x.moveTo(Math.random()*5,0);x.lineTo(Math.random()*5,TX);x.stroke();}}
    else if(name==='hedge'){x.fillStyle='hsl(120,30%,20%)';x.fillRect(0,0,TX,TX);for(let i=0;i<60;i++){x.fillStyle=`hsla(${110+Math.random()*30},${25+Math.random()*15}%,${18+Math.random()*10}%,.6)`;x.beginPath();x.arc(Math.random()*TX,Math.random()*TX,2+Math.random()*3,0,Math.PI*2);x.fill();}}

    else if(name==='doorFrame'){const h=phase==='horror'?350:200;x.fillStyle=`hsl(${h},15%,12%)`;x.fillRect(0,0,TX,TX);x.fillStyle=`hsl(${h},10%,20%)`;x.fillRect(6,0,52,TX);x.fillStyle=`hsl(${h},15%,5%)`;x.fillRect(12,4,40,56);x.strokeStyle=`hsla(${h},30%,35%,.3)`;x.lineWidth=1;x.strokeRect(12,4,40,56);}
    else if(name==='flat'){x.fillStyle='hsl(0,0%,15%)';x.fillRect(0,0,TX,TX);}
    else if(name==='symbol'){x.fillStyle='hsl(270,15%,8%)';x.fillRect(0,0,TX,TX);x.fillStyle='hsla(270,30%,30%,.25)';x.font='18px monospace';x.textAlign='center';x.fillText(['◆','▲','◯','✦','⬡','⊕','∞','☍','⛧'][Math.random()*9|0],32,38);}
  });

}

function mkSprite(type){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  if(type==='bed'){x.fillStyle='#2a1f15';x.fillRect(4,46,56,4);x.fillRect(4,14,56,4);x.fillRect(4,14,4,36);x.fillRect(56,14,4,36);x.fillStyle='#3a3650';x.fillRect(8,18,48,28);x.fillStyle='#ccc8c0';x.fillRect(10,19,16,10);x.fillRect(30,19,16,10);x.fillStyle='#4a4068';x.fillRect(8,30,48,16);}
  else if(type==='couch'){x.fillStyle='#4a3a2a';x.fillRect(4,28,56,28);x.fillStyle='#5a4a3a';x.fillRect(8,20,48,10);x.fillStyle='#6a5a4a';x.fillRect(12,30,18,22);x.fillRect(34,30,18,22);}
  else if(type==='tv'){
    // TV body
    x.fillStyle='#1a1a1a';x.fillRect(6,8,52,40);
    // screen (static gray glow)
    x.fillStyle='#1f1f23';x.fillRect(10,12,44,32);
    // flickering static pattern on screen
    for(let i=0;i<200;i++){
      const v=Math.random()*100+80|0;
      x.fillStyle=`rgba(${v},${v},${v},.6)`;
      x.fillRect(10+Math.random()*44|0,12+Math.random()*32|0,1,1);
    }
    // scanlines
    x.fillStyle='rgba(0,0,0,.2)';
    for(let y=12;y<44;y+=2)x.fillRect(10,y,44,1);
    // screen border highlight
    x.strokeStyle='#2a2a2a';x.lineWidth=1;x.strokeRect(10,12,44,32);
    // power LED
    x.fillStyle='#ff4400';x.fillRect(50,46,3,2);
    // stand
    x.fillStyle='#1a1a1a';x.fillRect(28,48,8,8);x.fillRect(22,56,20,4);
  }
  else if(type==='tvGlow'){
    // larger version with glow for rendering
    x.fillStyle='#1a1a1a';x.fillRect(6,8,52,40);
    x.fillStyle='#2a2a2e';x.fillRect(10,12,44,32);
    for(let i=0;i<200;i++){const v=Math.random()*120+100|0;x.fillStyle=`rgba(${v},${v},${v},.7)`;x.fillRect(10+Math.random()*44|0,12+Math.random()*32|0,1,1);}
    x.fillStyle='rgba(0,0,0,.2)';for(let y=12;y<44;y+=2)x.fillRect(10,y,44,1);
    x.strokeStyle='#3a3a3a';x.lineWidth=1;x.strokeRect(10,12,44,32);
    x.fillStyle='#ff4400';x.fillRect(50,46,3,2);
    x.fillStyle='#1a1a1a';x.fillRect(28,48,8,8);x.fillRect(22,56,20,4);
  }
  else if(type==='fridge'){x.fillStyle='#d0d0c8';x.fillRect(16,8,32,50);x.strokeStyle='#bbb';x.lineWidth=1;x.strokeRect(16,8,32,50);x.fillStyle='#aaa';x.fillRect(44,22,2,6);x.fillRect(44,40,2,6);x.strokeStyle='#c0c0b8';x.beginPath();x.moveTo(16,32);x.lineTo(48,32);x.stroke();}
  else if(type==='table'){x.fillStyle='#3a2a1a';x.fillRect(10,34,44,4);x.fillRect(14,38,4,18);x.fillRect(46,38,4,18);}
  else if(type==='toilet'){x.fillStyle='#e0e0d8';x.beginPath();x.ellipse(32,42,10,12,0,0,Math.PI*2);x.fill();x.fillRect(26,22,12,20);x.fillStyle='#d4d4cc';x.fillRect(24,16,16,8);}
  else if(type==='sink'){x.fillStyle='#d8d8d0';x.fillRect(20,32,24,10);x.fillStyle='#bbb';x.beginPath();x.ellipse(32,37,8,5,0,0,Math.PI*2);x.fill();x.fillStyle='#999';x.fillRect(30,24,4,8);x.fillRect(28,22,8,3);}
  else if(type==='nightstand'){x.fillStyle='#3a2a18';x.fillRect(18,30,28,26);x.strokeStyle='#2a1a08';x.strokeRect(20,36,24,8);x.fillStyle='#aa8844';x.fillRect(30,14,4,16);x.fillStyle='#eedd88';x.beginPath();x.moveTo(24,14);x.lineTo(40,14);x.lineTo(36,6);x.lineTo(28,6);x.closePath();x.fill();}
  else if(type==='bookshelf'){x.fillStyle='#2a1a0a';x.fillRect(12,8,40,50);for(let sh=0;sh<4;sh++){x.fillStyle='#3a2a1a';x.fillRect(12,8+sh*12,40,2);for(let b=0;b<5;b++){x.fillStyle=`hsl(${Math.random()*360},${30+Math.random()*30}%,${25+Math.random()*20}%)`;x.fillRect(16+b*7,10+sh*12,5,8+Math.random()*2);}}}
  else if(type==='bush'){x.fillStyle='hsl(120,35%,22%)';x.beginPath();x.arc(32,40,18,0,Math.PI*2);x.fill();x.beginPath();x.arc(22,35,12,0,Math.PI*2);x.fill();x.beginPath();x.arc(42,35,14,0,Math.PI*2);x.fill();x.fillStyle='hsl(120,30%,18%)';x.beginPath();x.arc(32,45,10,0,Math.PI*2);x.fill();}
  else if(type==='flower'){const hue=Math.random()*360;x.fillStyle='hsl(120,30%,25%)';x.fillRect(30,35,4,20);x.fillStyle=`hsl(${hue},60%,55%)`;for(let p=0;p<5;p++){const a=p/5*Math.PI*2;x.beginPath();x.arc(32+Math.cos(a)*6,30+Math.sin(a)*6,4,0,Math.PI*2);x.fill();}x.fillStyle='hsl(50,70%,60%)';x.beginPath();x.arc(32,30,3,0,Math.PI*2);x.fill();}
  else if(type==='meadowTree'){x.fillStyle='hsl(25,25%,18%)';x.fillRect(28,35,8,25);x.fillStyle='hsl(110,35%,28%)';x.beginPath();x.arc(32,28,16,0,Math.PI*2);x.fill();x.fillStyle='hsl(120,40%,22%)';x.beginPath();x.arc(26,32,10,0,Math.PI*2);x.fill();x.beginPath();x.arc(38,30,12,0,Math.PI*2);x.fill();x.fillStyle='hsl(115,30%,32%)';x.beginPath();x.arc(32,22,10,0,Math.PI*2);x.fill();}
  else if(type==='autumnTree'){x.fillStyle='hsl(20,20%,14%)';x.fillRect(28,38,8,22);x.fillStyle='hsl(25,40%,30%)';x.beginPath();x.arc(32,30,14,0,Math.PI*2);x.fill();x.fillStyle='hsl(35,45%,35%)';x.beginPath();x.arc(26,33,9,0,Math.PI*2);x.fill();x.fillStyle='hsl(15,35%,25%)';x.beginPath();x.arc(38,28,11,0,Math.PI*2);x.fill();x.fillStyle='hsl(40,35%,38%)';x.beginPath();x.arc(30,24,8,0,Math.PI*2);x.fill();}
  return c.getContext('2d').getImageData(0,0,64,64);
}

function buildMeadow(){
  phase='meadow';layerDepth=0;dread=0;setTextStyle(0);dreamCount++;
  const sz=45;mW=sz;mH=sz;map=new Array(sz*sz).fill(10);
  for(let x=0;x<sz;x++){map[x]=1;map[(sz-1)*sz+x]=1;map[x*sz]=1;map[x*sz+sz-1]=1;}
  for(let i=0;i<35;i++){const x=2+Math.random()*(sz-4)|0,y=2+Math.random()*(sz-4)|0;if(Math.hypot(x-sz/2,y-sz/2+4)>10&&Math.hypot(x-sz/2,y-sz+4)>4)map[y*sz+x]=2;}
  const lcx=sz/2,lcy=sz/2-4,lR=7;
  for(let y=1;y<sz-1;y++)for(let x=1;x<sz-1;x++)if(Math.hypot(x-lcx,y-lcy)<lR)map[y*sz+x]=6;
  const dkX=Math.floor(lcx);for(let dy=0;dy>-lR-2;dy--){const ty=Math.floor(lcy+lR)+dy;if(ty>0&&ty<sz-1)map[ty*sz+dkX]=7;}
  sprites=[];
  for(let i=0;i<30;i++){let sx,sy;do{sx=3+Math.random()*(sz-6);sy=3+Math.random()*(sz-6);}while(Math.hypot(sx-lcx,sy-lcy)<lR+3||Math.hypot(sx-sz/2,sy-sz+4)<3||map[Math.floor(sy)*sz+Math.floor(sx)]!==10);
    sprites.push({x:sx,y:sy,img:mkSprite(Math.random()<.4?'bush':Math.random()<.5?'flower':'meadowTree'),grounded:true});}
  doorZones=[{x:lcx,y:lcy,r:lR-1,target:'forest',type:'water'}];
  P.x=sz/2;P.y=sz-4;P.a=-Math.PI/2;
  startDrone();setDrn({b:55,l:.04,d:2,v:.025});
  showDream("it's beautiful here");
}

function buildForest(){
  phase='forest';layerDepth=1;dread=.15;setTextStyle(1);dreamCount++;
  const sz=35;mW=sz;mH=sz;map=new Array(sz*sz).fill(11);
  for(let x=0;x<sz;x++){map[x]=1;map[(sz-1)*sz+x]=1;map[x*sz]=1;map[x*sz+sz-1]=1;}
  for(let y=2;y<sz-2;y++)for(let x=2;x<sz-2;x++){const distCenter=Math.abs(x-sz/2);if(distCenter>3+Math.sin(y*.3)*2){if(Math.random()<.6)map[y*sz+x]=2;}else{map[y*sz+x]=Math.random()<.3?12:11;}}
  for(let y=sz-6;y<sz-1;y++)for(let x=sz/2-4;x<sz/2+4;x++)map[y*sz+x]=11;
  const dx2=Math.floor(sz/2);map[1*sz+dx2]=4;
  doorZones=[{x:dx2+.5,y:1.5,r:1.8,target:'twilight'}];
  sprites=[];
  for(let i=0;i<15;i++){let sx,sy;do{sx=2+Math.random()*(sz-4);sy=2+Math.random()*(sz-4);}while(map[Math.floor(sy)*sz+Math.floor(sx)]!==11&&map[Math.floor(sy)*sz+Math.floor(sx)]!==12);sprites.push({x:sx,y:sy,img:mkSprite('autumnTree'),grounded:true});}
  P.x=sz/2;P.y=sz-3;P.a=-Math.PI/2;
  setDrn({b:42,l:.1,d:5,v:.04});
  showDream("the path continues");
  setTimeout(()=>playE('wind'),2000);
}

function buildTwilight(){

  const hallW=5,hallH=60;mW=hallW;mH=hallH;map=new Array(hallW*hallH).fill(0);
  for(let y=0;y<hallH;y++){map[y*hallW]=1;map[y*hallW+hallW-1]=1;}
  for(let x=0;x<hallW;x++){map[x]=1;map[(hallH-1)*hallW+x]=1;}
  for(let y=6;y<hallH-6;y+=8){if(Math.random()<.5)map[y*hallW+1]=2;if(Math.random()<.5)map[y*hallW+hallW-2]=2;}
  for(let y=10;y<hallH-10;y+=12){if(Math.random()<.4){const x2=Math.random()<.5?1:hallW-2;map[y*hallW+x2]=5;}}
  map[1*hallW+Math.floor(hallW/2)]=4;
  doorZones=[{x:Math.floor(hallW/2)+.5,y:1.5,r:1.5,target:'fog'}];
  sprites=[];
  P.x=hallW/2;P.y=hallH-3;P.a=-Math.PI/2;

}

function buildFog(){
  phase='fog';layerDepth=3;dread=.45;setTextStyle(3);dreamCount++;
  const sz=20;mW=sz;mH=sz;map=new Array(sz*sz).fill(0);
  for(let x=0;x<sz;x++){map[x]=1;map[(sz-1)*sz+x]=1;map[x*sz]=1;map[x*sz+sz-1]=1;}
  for(let y=3;y<sz-3;y+=3)for(let x=2;x<sz-2;x++)if(Math.random()<.45)map[y*sz+x]=2;
  for(let y=3;y<sz-3;y+=3){const gx=3+Math.random()*(sz-6)|0;map[y*sz+gx]=0;if(y+1<sz)map[(y+1)*sz+gx]=0;}
  const wp=[];for(let x=3;x<sz-3;x+=3)wp.push({x,y:0});for(let y=3;y<sz-3;y+=3)wp.push({x:sz-1,y});
  for(let i=wp.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[wp[i],wp[j]]=[wp[j],wp[i]];}
  doorZones=[];
  for(let i=0;i<Math.min(2,wp.length);i++){const p=wp[i];map[p.y*sz+p.x]=4;doorZones.push({x:p.x+.5,y:p.y+.5,r:1.5,target:'horror:1'});}
  sprites=[];P.x=sz/2;P.y=sz/2;P.a=Math.random()*Math.PI*2;
  while(map[Math.floor(P.y)*mW+Math.floor(P.x)]!==0){P.x=2+Math.random()*(sz-4);P.y=2+Math.random()*(sz-4);}
  setDrn({b:30,l:.4,d:12,v:.055});
  showDream("you can't see anything");
}

function buildHorror(depth){
  phase='horror';layerDepth=4+depth;horrorDepth=depth;dread=Math.min(1,.5+depth*.1);setTextStyle(4);dreamCount++;playerFrozen=false;
  const sz=Math.max(12,14+depth*2);mW=sz;mH=sz;map=new Array(sz*sz).fill(0);
  for(let x=0;x<sz;x++){map[x]=1;map[(sz-1)*sz+x]=1;map[x*sz]=1;map[x*sz+sz-1]=1;}
  const walls=Math.floor(depth*2)+4;
  for(let i=0;i<walls;i++){const px=2+Math.random()*(sz-4)|0,py=2+Math.random()*(sz-4)|0;if(map[py*sz+px]===0)map[py*sz+px]=Math.random()<.2?5:[1,2,3][Math.random()*3|0];}
  if(depth>2){const mid=sz>>1;for(let i=2;i<sz-2;i++)if(Math.random()<.5)map[mid*sz+i]=1;for(let g=0;g<3;g++)map[mid*sz+(3+Math.random()*(sz-6)|0)]=0;}
  const wp=[];for(let x=3;x<sz-3;x+=3)wp.push({x,y:0});for(let x=3;x<sz-3;x+=3)wp.push({x,y:sz-1});for(let y=3;y<sz-3;y+=3)wp.push({x:0,y});for(let y=3;y<sz-3;y+=3)wp.push({x:sz-1,y});
  for(let i=wp.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[wp[i],wp[j]]=[wp[j],wp[i]];}
  doorZones=[];const numD=2+Math.random()*2|0;
  for(let i=0;i<Math.min(numD,wp.length);i++){const p=wp[i];map[p.y*mW+p.x]=4;doorZones.push({x:p.x+.5,y:p.y+.5,r:1.5,target:'horror:'+(Math.random()<.7?depth+1:Math.max(1,depth+Math.floor(Math.random()*3)-1)),label:corrupt(HDOORS[Math.random()*HDOORS.length|0],.4+depth*.08)});}
  sprites=[];P.x=sz/2;P.y=sz/2;P.a=Math.random()*Math.PI*2;
  while(map[Math.floor(P.y)*mW+Math.floor(P.x)]!==0){P.x=2+Math.random()*(sz-4);P.y=2+Math.random()*(sz-4);}
  const bv=Math.max(10,24-depth*2);setDrn({b:bv,l:Math.min(2,.8+depth*.1),d:Math.min(40,18+depth*2),v:Math.min(.09,.065+depth*.003)});
  if(depth>0){playE('demon');setTimeout(()=>playE('cry'),1500+Math.random()*2000);if(depth>2)setTimeout(()=>playE('help'),3000+Math.random()*2000);}
  showDream(depth>3?corrupt(HMSG[Math.random()*HMSG.length|0],depth*.1):HMSG[Math.random()*HMSG.length|0]);

  // At depth 6, trigger the wake-up sequence
  if(depth>=6&&!hasWokenUp){
    hasWokenUp=true;
    setTimeout(()=>{
      playerFrozen=true;
      spawnW8(true);
      showDream(corrupt('YOU NEVER LEFT',1));
      setTimeout(()=>{
        // fade to black, then wake up
        const ov=document.getElementById('overlay');
        ov.style.transition='opacity 2s';ov.style.opacity='1';
        setTimeout(()=>{
          buildWakeUp();
          ov.style.transition='opacity 3s';ov.style.opacity='0';
          setTimeout(()=>showDream('oh thank god\nit was just a '+corrupt('dream',1.2)),1500);
        },2500);
      },2500);
    },3000);
  }
}

function buildEndHallway(){
  phase='endHall';layerDepth=99;dread=.2;setTextStyle(2);
  // Narrow bedroom-style hallway, TV at the far end
  const hallW=5,hallH=28;
  mW=hallW;mH=hallH;map=new Array(hallW*hallH).fill(0);
  for(let y=0;y<hallH;y++){map[y*hallW]=2;map[y*hallW+hallW-1]=2;} // int walls (bedroom style)
  for(let x=0;x<hallW;x++){map[x]=2;map[(hallH-1)*hallW+x]=2;}
  sprites=[];doorZones=[];
  // TV at the far end
  sprites.push({x:hallW/2,y:2.5,img:mkSprite('tvGlow'),grounded:true});
  // trigger zone right at the TV
  doorZones.push({x:hallW/2,y:2,r:1.0,target:'end2027'});
  P.x=hallW/2;P.y=hallH-3;P.a=-Math.PI/2;
  fadeDrone();
  startTVStatic();
  // no dream text — silence is the vibe
}

function triggerEndScreen(){
  if(endTriggered)return;
  endTriggered=true;stopTVStatic();
  phase='ended';playerFrozen=true;
  const sd=document.getElementById('scare'),sc=document.getElementById('scareCanvas');
  sc.width=RW;sc.height=RH;const sx=sc.getContext('2d');
  sd.style.display='flex';
  // loud burst on impact
  if(AC){
    const t=AC.currentTime;
    const bs=AC.sampleRate*.4,buf=AC.createBuffer(1,bs,AC.sampleRate),bd=buf.getChannelData(0);
    for(let i=0;i<bs;i++)bd[i]=(Math.random()*2-1)*.8;
    const s=AC.createBufferSource();s.buffer=buf;
    const g=AC.createGain();g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.1,t+.4);
    s.connect(g);g.connect(masterG);s.start(t);
    // sustained static loop
    const buf2=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),bd2=buf2.getChannelData(0);
    for(let i=0;i<bd2.length;i++)bd2[i]=(Math.random()*2-1)*.5;
    const s2=AC.createBufferSource();s2.buffer=buf2;s2.loop=true;
    const g2=AC.createGain();g2.gain.value=.1;
    s2.connect(g2);g2.connect(masterG);s2.start(t+.3);
  }
  // animated static + year
  const anim=()=>{
    const id=sx.createImageData(RW,RH);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=255;}
    sx.putImageData(id,0,0);
    sx.font='bold 72px "Share Tech Mono", monospace';
    sx.textAlign='center';sx.textBaseline='middle';
    const jx=Math.random()*3-1.5,jy=Math.random()*3-1.5;
    sx.fillStyle='rgba(0,0,0,0.85)';sx.fillText('2027',RW/2+jx+2,RH/2+jy+2);
    sx.fillStyle='#fff';sx.fillText('2027',RW/2+jx,RH/2+jy);
    requestAnimationFrame(anim);
  };
  anim();
}

// ─── SLEEP ───
function goToSleep(){
  if(phase!=='house')return;phase='sleep';
  document.getElementById('overlay').style.opacity='1';
  const st=document.getElementById('sleepTxt');
  setTimeout(()=>{st.textContent='...';st.style.opacity='1';},3000);
  setTimeout(()=>{st.style.opacity='0';},5500);
  setTimeout(()=>{buildMeadow();document.getElementById('overlay').style.opacity='0';},7000);
}

function showDream(t){if(!t)return;const el=document.getElementById('dtxt');el.textContent=t;el.style.color=phase==='horror'?`hsl(${350+Math.random()*20},40%,60%)`:`hsl(${Math.random()*360},30%,70%)`;el.style.opacity='1';setTimeout(()=>{el.style.opacity='0';},4500);}
function transTo(tgt){if(transing||endTriggered)return;transing=true;transTgt=tgt;transA=0;
  if(AC){const t=AC.currentTime;const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(phase==='horror'?80:180+Math.random()*120,t);o.frequency.exponentialRampToValueAtTime(20,t+.8);const g=AC.createGain();g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(masterG);o.start(t);o.stop(t+1);if(phase==='horror')playE('rumble');}}

function loadLevel(tgt){
  W8.active=false;W8.opacity=0;
  Object.keys(TEX_CACHE).forEach(k=>delete TEX_CACHE[k]);
  if(tgt==='meadow')buildMeadow();
  else if(tgt==='forest')buildForest();
  else if(tgt==='twilight')buildTwilight();
  else if(tgt==='fog')buildFog();
  else if(tgt==='endHall')buildEndHallway();
  else if(tgt==='end2027'){triggerEndScreen();return;}
  else if(tgt.startsWith('horror:'))buildHorror(parseInt(tgt.split(':')[1])||1);
}

function getRenderCfg(){
  if(phase==='house'||phase==='wakeup')return{ceil:[.4,.38,.35],flr:[0,0,0],fog:[.03,.028,.025],wobble:0,fogDist:10,floorTex:'wood',skyCol:null};
  if(phase==='endHall')return{ceil:[.25,.22,.2],flr:[0,0,0],fog:[.02,.018,.018],wobble:0,fogDist:12,floorTex:'wood',skyCol:null};
  if(phase==='meadow')return{ceil:[.45,.6,.85],flr:[0,0,0],fog:[.02,.04,.02],wobble:.3,fogDist:25,floorTex:'grass',skyCol:[115,155,220],wallTex:['hedge','hedge','hedge']};
  if(phase==='forest')return{ceil:[.25,.22,.2],flr:[0,0,0],fog:[.03,.025,.02],wobble:.8,fogDist:16,floorTex:'dirt',skyCol:[100,90,80],wallTex:['treeAutumn','treeAutumn','tree']};
  if(phase==='twilight')return{ceil:[.12,.1,.15],flr:[.06,.05,.08],fog:[.02,.015,.025],wobble:1.5,fogDist:14,floorTex:null,skyCol:null,wallTex:['flat','flat','symbol']};
  if(phase==='fog')return{ceil:[.08,.08,.08],flr:[.04,.04,.04],fog:[.03,.03,.03],wobble:2,fogDist:8,floorTex:null,skyCol:null,wallTex:['flat','symbol','flat']};
  const d=horrorDepth||0;
  return{ceil:[Math.max(.01,.12-.01*d),Math.max(.005,.02-.002*d),Math.max(.005,.02-.002*d)],flr:[.08-.005*d,.01,.01].map(v=>Math.max(.005,v)),fog:[.04,.003,.003],wobble:3+d*.5,fogDist:Math.max(5,14-d),floorTex:null,skyCol:null,wallTex:['flat','flat','symbol']};
}
function getWallTex(hit,cfg){
  if(phase==='house'||phase==='wakeup'){if(hit===1)return tex('houseWall');if(hit===2)return tex('houseInt');if(hit===3)return tex('houseTile');return tex('houseWall');}
  if(phase==='endHall'){if(hit===2)return tex('bedWall');return tex('bedWall');}
  if(hit===4)return tex('doorFrame');if(hit===5)return tex('symbol');if(hit===6)return tex('water');
  const wt=cfg.wallTex||['flat','flat','flat'];
  if(hit===1)return tex(wt[0]);if(hit===2)return tex(wt[1]);return tex(wt[2]||wt[0]);
}
function getFloorTex(tile,cfg){if(tile===6)return tex('water');if(tile===7)return tex('dock');if(tile===10)return tex('grass');if(tile===11)return tex('dirt');if(tile===12)return tex('leaves');if(cfg.floorTex)return tex(cfg.floorTex);return null;}

const imgD=ct.createImageData(RW,RH),zB=new Float64Array(RW);

function render(){
  const data=imgD.data,halfH=RH/2,cfg=getRenderCfg();
  const wobA=cfg.wobble,bobY=Math.sin(P.bob)*((phase==='house'||phase==='wakeup'||phase==='endHall')?2:4);
  const shY=phase==='horror'?Math.cos(dTime*5.3)*(.5+(horrorDepth||0)*.3):0;

  for(let x=0;x<RW;x++){
    const ra=P.a-FOV/2+(x/RW)*FOV,rs=Math.sin(ra),rc=Math.cos(ra);
    const ddx=rc===0?1e10:Math.abs(1/rc),ddy=rs===0?1e10:Math.abs(1/rs);
    let mx2=Math.floor(P.x),my2=Math.floor(P.y),stX,stY,sdx,sdy,side;
    if(rc<0){stX=-1;sdx=(P.x-mx2)*ddx;}else{stX=1;sdx=(mx2+1-P.x)*ddx;}
    if(rs<0){stY=-1;sdy=(P.y-my2)*ddy;}else{stY=1;sdy=(my2+1-P.y)*ddy;}
    let hit=0;
    for(let i=0;i<60;i++){if(sdx<sdy){sdx+=ddx;mx2+=stX;side=0;}else{sdy+=ddy;my2+=stY;side=1;}if(mx2<0||mx2>=mW||my2<0||my2>=mH)break;hit=map[my2*mW+mx2];
      if(hit>=6&&hit!==4&&hit!==5){hit=0;continue;}
      if(hit>=10){hit=0;continue;}
      if(hit>0)break;}
    if(!hit){zB[x]=1e10;
      for(let y=0;y<RH;y++){const idx=(y*RW+x)*4;
        if(cfg.skyCol&&y<halfH){const f=y/halfH;data[idx]=Math.floor(cfg.skyCol[0]*(1-f*.3));data[idx+1]=Math.floor(cfg.skyCol[1]*(1-f*.3));data[idx+2]=Math.floor(cfg.skyCol[2]*(1-f*.3));}
        else{data[idx]=Math.floor(cfg.fog[0]*40);data[idx+1]=Math.floor(cfg.fog[1]*40);data[idx+2]=Math.floor(cfg.fog[2]*40);}
        data[idx+3]=255;}continue;}
    const dist=side===0?sdx-ddx:sdy-ddy,perpD=dist*Math.cos(ra-P.a);zB[x]=perpD;
    const wH2=Math.floor(RH/perpD),dS=Math.max(0,Math.floor(halfH-wH2/2+bobY+shY)),dE=Math.min(RH-1,Math.floor(halfH+wH2/2+bobY+shY));
    const jit=wobA>0?Math.sin(dTime*3+x*.1)*wobA/(perpD+1):0;
    let wallX=side===0?P.y+dist*rs:P.x+dist*rc;wallX-=Math.floor(wallX);const tXc=Math.floor(wallX*TX);
    const tImg=getWallTex(hit,cfg);

    for(let y=0;y<RH;y++){const idx=(y*RW+x)*4;
      if(y<dS){
        if(cfg.skyCol){const f=y/halfH;const pulse=phase==='house'||phase==='wakeup'?1:1+Math.sin(dTime*.5+x*.02)*.08;data[idx]=Math.floor(cfg.skyCol[0]*(1-f*.3)*pulse);data[idx+1]=Math.floor(cfg.skyCol[1]*(1-f*.3)*pulse);data[idx+2]=Math.floor(cfg.skyCol[2]*(1-f*.3)*pulse);}
        else{const f=1-y/halfH;data[idx]=Math.floor(cfg.ceil[0]*f*255);data[idx+1]=Math.floor(cfg.ceil[1]*f*255);data[idx+2]=Math.floor(cfg.ceil[2]*f*255);}
        data[idx+3]=255;
      }else if(y>dE){
        const rowDist=halfH/(y-halfH);const flX=P.x+rc*rowDist,flY=P.y+rs*rowDist;
        const fmx=Math.floor(flX),fmy=Math.floor(flY);const ft=(fmx>=0&&fmx<mW&&fmy>=0&&fmy<mH)?map[fmy*mW+fmx]:0;
        const flTex=getFloorTex(ft,cfg);
        if(flTex){let ftx,fty;if(ft===6){ftx=Math.floor((flX*3+Math.sin(dTime+flY))%TX+TX)%TX;fty=Math.floor((flY*3+Math.cos(dTime*.7+flX))%TX+TX)%TX;}else{ftx=Math.floor(flX*4)&(TX-1);fty=Math.floor(flY*4)&(TX-1);}
          const fi=(fty*TX+ftx)*4;const fogF=Math.min(1,rowDist/cfg.fogDist);data[idx]=Math.floor(flTex.data[fi]*(1-fogF)+cfg.fog[0]*fogF*200);data[idx+1]=Math.floor(flTex.data[fi+1]*(1-fogF)+cfg.fog[1]*fogF*200);data[idx+2]=Math.floor(flTex.data[fi+2]*(1-fogF)+cfg.fog[2]*fogF*200);}
        else{const f=(y-halfH)/halfH;data[idx]=Math.floor(cfg.flr[0]*f*255);data[idx+1]=Math.floor(cfg.flr[1]*f*255);data[idx+2]=Math.floor(cfg.flr[2]*f*255);}
        data[idx+3]=255;
      }else{
        let tY=Math.floor(((y-dS)/(dE-dS+1))*TX);
        const wX2=wobA>0?Math.floor(tXc+jit*2+Math.sin(y*.1+dTime)*wobA*.3)&(TX-1):tXc;
        if(wobA>0)tY=(tY+Math.floor(Math.sin(x*.05+dTime*2)*wobA*.2))&(TX-1);
        const tI=(tY*TX+(wX2&(TX-1)))*4;let sh=side===1?.6:1;const fogD=Math.min(1,perpD/cfg.fogDist);sh*=(1-fogD*((phase==='house'||phase==='wakeup'||phase==='endHall')?.5:.75));
        let gR=0,gG=0,gB=0;
        if(hit===4){const g2=(Math.sin(dTime*3)*.5+.5)*.3;if(phase==='horror'){gR=40*g2;gG=5*g2;}else{gR=15*g2;gG=35*g2;gB=55*g2;}}
        if(hit===5){const g2=(Math.sin(dTime*2+x*.1)*.5+.5)*.4;gR=35*g2;gB=45*g2;}
        data[idx]=Math.min(255,Math.floor(tImg.data[tI]*sh+cfg.fog[0]*fogD*255+gR));data[idx+1]=Math.min(255,Math.floor(tImg.data[tI+1]*sh+cfg.fog[1]*fogD*255+gG));data[idx+2]=Math.min(255,Math.floor(tImg.data[tI+2]*sh+cfg.fog[2]*fogD*255+gB));data[idx+3]=255;
      }
    }
  }

  // sprites + watcher
  const sorted=[...sprites.map(s=>({...s,dist:Math.hypot(s.x-P.x,s.y-P.y)}))];
  if(W8.active&&W8.opacity>.01)sorted.push({x:W8.x,y:W8.y,dist:Math.hypot(W8.x-P.x,W8.y-P.y),img:W8.img,opacity:W8.opacity,isWatcher:true});
  sorted.sort((a,b)=>b.dist-a.dist);

  sorted.forEach(sp=>{
    let a=Math.atan2(sp.y-P.y,sp.x-P.x)-P.a;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;
    if(Math.abs(a)>FOV/2+.3)return;
    const scrX=(.5+a/FOV)*RW|0;
    const scale=sp.isWatcher?1.8:.55;
    const sprH2=RH/sp.dist*scale|0,sprW2=sprH2;
    const floorY=Math.floor(halfH+RH/(2*sp.dist)+bobY+shY);
    const sy0=sp.isWatcher?(RH/2-sprH2/2+bobY+Math.sin(dTime*.3)*2|0):(floorY-sprH2);
    const sx0=scrX-sprW2/2|0;
    const fogV=Math.min(1,sp.dist/(cfg.fogDist*.8));
    const opc=sp.isWatcher?sp.opacity:1;
    const iw=sp.img.width||64,ih=sp.img.height||64;
    for(let sx=Math.max(0,sx0);sx<Math.min(RW,sx0+sprW2);sx++){if(sp.dist>zB[sx])continue;const tx2=((sx-sx0)/sprW2*iw)|0;
      for(let sy=Math.max(0,sy0);sy<Math.min(RH-1,sy0+sprH2);sy++){const ty=((sy-sy0)/sprH2*ih)|0,tI2=(ty*iw+tx2)*4;if(sp.img.data[tI2+3]<30)continue;
        const idx2=(sy*RW+sx)*4,sh=(1-fogV*.5)*opc;
        if(sp.isWatcher){data[idx2]=Math.min(255,sp.img.data[tI2]*sh*.4+15*fogV*opc|0);data[idx2+1]=Math.min(255,sp.img.data[tI2+1]*sh*.2|0);data[idx2+2]=Math.min(255,sp.img.data[tI2+2]*sh*.3+20*fogV*opc|0);}
        else{data[idx2]=Math.min(255,sp.img.data[tI2]*sh+cfg.fog[0]*fogV*180|0);data[idx2+1]=Math.min(255,sp.img.data[tI2+1]*sh+cfg.fog[1]*fogV*180|0);data[idx2+2]=Math.min(255,sp.img.data[tI2+2]*sh+cfg.fog[2]*fogV*180|0);}}}
  });

  doorZones.forEach(d=>{if(d.type==='water'||!d.label)return;const ddx2=d.x-P.x,ddy2=d.y-P.y,dist=Math.hypot(ddx2,ddy2);if(dist>10)return;let a=Math.atan2(ddy2,ddx2)-P.a;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;if(Math.abs(a)>FOV/2)return;d._sx=(.5+a/FOV)*RW;d._sy=RH/2+bobY+shY-20/dist;d._sd=dist;d._vis=true;});
  ct.putImageData(imgD,0,0);
  doorZones.forEach(d=>{if(!d._vis||!d.label)return;d._vis=false;const al=Math.max(.2,1-d._sd/8);ct.globalAlpha=al;ct.font='7px "Press Start 2P"';ct.textAlign='center';ct.fillStyle=phase==='horror'?'#f44':'#8ef';ct.shadowColor=ct.fillStyle;ct.shadowBlur=phase==='horror'?10:6;ct.fillText(d.label,d._sx,d._sy);ct.shadowBlur=0;ct.globalAlpha=1;});

  if(transing){ct.fillStyle=`rgba(0,0,0,${transA})`;ct.fillRect(0,0,RW,RH);}
  if(phase==='horror'&&Math.random()<.01*(horrorDepth||1)){ct.fillStyle=`rgba(80,0,0,${.05+Math.random()*.1})`;ct.fillRect(0,0,RW,RH);}
  const gc=phase==='horror'?.04+(horrorDepth||0)*.008:0;
  if(Math.random()<gc){try{const gy=Math.random()*RH|0;ct.putImageData(ct.getImageData(0,gy,RW,Math.random()*10+2|0),(Math.random()*24-12)|0,gy);}catch(e){}}
}

// ─── INTERACTION & MOVEMENT ───
function getNearBed(){if(phase!=='house')return null;
  for(const s of sprites){if(s.type==='bed'&&Math.hypot(s.x-P.x,s.y-P.y)<2.2){let a=Math.atan2(s.y-P.y,s.x-P.x)-P.a;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;if(Math.abs(a)<FOV/2.5)return s;}}return null;}
function checkDoorZones(){for(const d of doorZones){const dist=Math.hypot(P.x-d.x,P.y-d.y);if(d.type==='water'){const mx=Math.floor(P.x),my=Math.floor(P.y);if(mx>=0&&mx<mW&&my>=0&&my<mH&&map[my*mW+mx]===6){transTo(d.target);return true;}}else if(dist<d.r){transTo(d.target);return true;}}return false;}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'&&phase==='house'){const bed=getNearBed();if(bed)goToSleep();}});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.addEventListener('mousemove',e=>{
  if(!started)return;
  if(document.pointerLockElement!==cv&&document.pointerLockElement!==document.body)return;
  const mv=e.movementX||0;
  if(Math.abs(mv)>100)return;
  if(Math.abs(mv)<0.5)return;
  mXa+=mv;
});
document.addEventListener('click',()=>{if(started&&!document.pointerLockElement)cv.requestPointerLock();});

let eT=0;
function schedE(dt){if(phase==='house'||phase==='sleep'||phase==='wakeup'||phase==='endHall')return;
  eT+=dt;let rate;
  if(phase==='meadow')rate=8+Math.random()*12;
  else if(phase==='forest')rate=6+Math.random()*10;
  else if(phase==='horror')rate=4+Math.random()*5;
  else rate=7+Math.random()*12;
  if(eT>rate){eT=0;const r=Math.random();
    if(phase==='meadow'){if(r<.4)playE('birds');else if(r<.6)playE('wind');else playE('tone');}
    else if(phase==='forest'){if(r<.2)playE('creak');else if(r<.4)playE('wind');else if(r<.6)playE('tone');else showDream("the light is fading");}
    else if(phase==='horror'){if(r<.15)playE('demon');else if(r<.28)playE('cry');else if(r<.4)playE('help');else if(r<.5)playE('breathing');else if(r<.6)playE('heartbeat');else if(r<.75)showDream(horrorDepth>3?corrupt(HMSG[Math.random()*HMSG.length|0],dread):HMSG[Math.random()*HMSG.length|0]);else playE('whisper');}
    else{if(r<.2)playE('creak');else if(r<.35)playE('whisper');else if(r<.5)playE('tone');else showDream(["which way","the colors are wrong","time feels slow","was this room always here"][Math.random()*4|0]);}}
}

let lastT=0;
function loop(ts){requestAnimationFrame(loop);if(!started||endTriggered)return;
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;dTime+=dt;
  if(phase!=='sleep'&&!playerFrozen){
    P.a+=mXa*RSPD;mXa=0;if(keys['arrowleft'])P.a-=2.2*dt;if(keys['arrowright'])P.a+=2.2*dt;
    let mx2=0,my2=0;const cos=Math.cos(P.a),sin=Math.sin(P.a);
    if(keys['w']){mx2+=cos;my2+=sin;}if(keys['s']){mx2-=cos;my2-=sin;}if(keys['a']){mx2+=sin;my2-=cos;}if(keys['d']){mx2-=sin;my2+=cos;}
    P.moving=!!(mx2||my2);
    if(P.moving){const len=Math.hypot(mx2,my2);mx2=mx2/len*SPD*dt;my2=my2/len*SPD*dt;P.bob+=dt*8;playStp();
      const margin=.25,nx=P.x+mx2,ny=P.y+my2;
      const passable=v=>v===0||v>=6;
      const tX2=mW>0?map[Math.floor(P.y)*mW+Math.floor(nx+margin*Math.sign(mx2))]:-1;
      const tY2=mW>0?map[Math.floor(ny+margin*Math.sign(my2))*mW+Math.floor(P.x)]:-1;
      if(passable(tX2))P.x=nx;if(passable(tY2))P.y=ny;
      if(phase!=='house'||doorZones.length>0)checkDoorZones();
    }
  }else mXa=0;
  if(transing){transA+=dt*(phase==='horror'?1.8:2.5);if(transA>=1){loadLevel(transTgt);transA=1;setTimeout(()=>{const fo=()=>{transA-=.03;if(transA<=0){transA=0;transing=false;}else requestAnimationFrame(fo);};fo();},300);}}
  updateW8(dt);schedE(dt);updateTVStatic();
  const hintEl=document.getElementById('hint');
  if(phase==='house'){const bed=getNearBed();hintEl.textContent=bed?'[ E ] go to sleep':'';}
  else hintEl.textContent='';
  render();
}

document.getElementById('titleScreen').addEventListener('click',()=>{
  document.getElementById('titleScreen').style.display='none';
  started=true;cv.requestPointerLock();initAudio();buildHouse();startHouseAmb();lastT=performance.now();
});
requestAnimationFrame(loop);
</script>
